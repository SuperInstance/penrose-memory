[package]
name = "penrose-memory"
version = "1.1.0"
edition = "2021"
description = "Aperiodic memory palace for AI agents with tile lifecycle, simulation-first predictions, and Lamport clocks."
license = "MIT"
repository = "https://github.com/SuperInstance/penrose-memory"
readme = "README.md"
keywords = ["penrose", "memory", "ai", "tiling", "aperiodic"]
categories = ["data-structures", "science"]
exclude = ["/pyproject.toml", "/penrose_memory/"]

[dependencies]

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "tensor_tile_bench"
harness = false

[[bench]]
name = "simd_compare"
harness = false

[workspace]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "penrose-memory"
version = "0.1.0"
description = "Aperiodic memory palace for AI agents. Navigate memories by distance + direction."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["penrose", "memory", "ai", "tiling", "aperiodic"]

[project.urls]
Repository = "https://github.com/SuperInstance/penrose-memory"
